# Explicit Knowledge Library allowlist for my-superpowers.
# This file selects candidates only; it does not ingest, copy, or mutate documents.
# Paths are relative to source_root and every current file is listed explicitly.

schema_version: 1
reviewed_at: 2026-08-20
source_root: /Users/pisitkoolplukpol/Work/my-superpowers/docs
default_action: exclude

policy:
  include:
    description: "Safe candidate for curated Knowledge Library ingestion. Preserve source provenance and research caveats."
    requires: [stable-or-reusable-content, provenance, no-secrets]
    default_review_after: 2026-11-20
  review:
    description: "Do not ingest automatically. Human review must confirm freshness, sensitivity, authority, and duplication first."
  exclude:
    description: "Do not ingest from this allowlist. A future exception requires an explicit entry change and review."
  identity:
    source_uri: "file://{source_root}/{path}"
    update_existing_identity: true
  safety:
    source_code: false
    agent_instructions: false
    generated_machine_readable_output: false
    chat_transcripts: false
    credentials_or_private_runtime_state: false

entries:
  - path: research/README.md
    action: include
    reason: "Canonical navigation and provenance index for the research corpus."
    tags: [research, index, provenance]
    review_after: 2026-11-20
  - path: knowledge-allowlist.yml
    action: exclude
    reason: "Policy metadata; never ingest the allowlist itself as source knowledge."

